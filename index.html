<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="حمّل تطبيق باب المعظم وتسوّق مستلزمات طب الأسنان بسهولة."
  >

  <title>تطبيق باب المعظم</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      color: #ffffff;
      background:
        linear-gradient(
          160deg,
          #081a33 0%,
          #12345b 55%,
          #071522 100%
        );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      overflow: hidden;
      border-radius: 24px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 36px;
      line-height: 1.3;
    }

    .intro {
      margin-bottom: 20px;
      color: #e5e7eb;
      line-height: 1.8;
      font-size: 17px;
    }

    .btn {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 16px;
      border-radius: 15px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .store {
      color: #111827;
      background: #ffffff;
    }

    .contact {
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
    }

    .footer {
      margin-top: 25px;
      color: #f3f4f6;
      font-size: 16px;
      line-height: 2;
    }

    .footer a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .box {
        padding: 24px 18px;
      }

      h1 {
        font-size: 30px;
      }

      .btn {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="logo">
      <img
        src="logo.jpg"
        alt="شعار باب المعظم"
      >
    </div>

    <h1>تطبيق باب المعظم</h1>

    <p class="intro">
      اختر نوع جهازك لتحميل التطبيق
      <br>
      ومشاهدة الأسعار والعروض الجديدة
    </p>

    <a
      class="btn store"
      href="https://play.google.com/store/apps/details?id=app.technolanes.babelmoatham"
      target="_blank"
      rel="noopener noreferrer"
    >
      تحميل للأندرويد — Google Play
    </a>

    <a
      class="btn store"
      href="https://apps.apple.com/iq/app/%D8%A8%D8%A7%D8%A8-%D8%A7%D9%84%D9%85%D8%B9%D8%B8%D9%85/id6785008966?l=ar"
      target="_blank"
      rel="noopener noreferrer"
    >
      تحميل للآيفون — App Store
    </a>

    <a
      class="btn contact"
      href="https://t.me/Bab_almuadam"
      target="_blank"
      rel="noopener noreferrer"
    >
      التواصل عبر تيليجرام
    </a>

    <a
      class="btn contact"
      href="https://wa.me/9647735447783"
      target="_blank"
      rel="noopener noreferrer"
    >
      التواصل عبر واتساب
    </a>

    <div class="footer">
      🚛 توصيل مجاني إلى جميع محافظات العراق
      <br><br>

      📱
      <a href="tel:07735447783">
        07735447783
      </a>
    </div>

  </main>

</body>

</html>
